name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    # The preview runner may break at any time. Do not let it fail the workflow
    # (or block a release), only mark its job.
    continue-on-error: ${{ matrix.preview }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 26, current GA image (Xcode 26)
          - runner: macos-26
            preview: false
          # macOS 27 with Xcode 27: public preview. GitHub labels this image
          # "xcode-27". There is no "macos-27" label yet.
          - runner: xcode-27
            preview: true
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Import signing certificate
        # build.sh refuses to sign ad hoc, so the runner needs the same Apple
        # Development certificate the maintainer builds with: the .p12 export
        # (certificate and private key) base64-encoded in SHELLDER_SIGN_P12,
        # its export password in SHELLDER_SIGN_P12_PASSWORD. It goes into a
        # throwaway keychain that the last step deletes. Secrets are not
        # available to pull requests from forks; those builds fail here.
        env:
          P12_BASE64: ${{ secrets.SHELLDER_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.SHELLDER_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::error::secret SHELLDER_SIGN_P12 is not set; build.sh does not sign ad hoc"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          P12="$RUNNER_TEMP/signing.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Let codesign use the key without a dialog (there is nobody to answer one).
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build app bundle
        run: ./build.sh

      - name: Verify bundle
        run: |
          codesign --verify --strict --verbose=2 build/Shellder.app
          # Apple-signed, not ad hoc: a Team ID is present.
          codesign -dv --verbose=2 build/Shellder.app 2>&1 | grep -E '^TeamIdentifier=[A-Z0-9]{10}$'
          plutil -lint build/Shellder.app/Contents/Info.plist
          test -f build/Shellder.app/Contents/Resources/shellder.icns
          test -f build/Shellder.app/Contents/Resources/menubar.png
          test -f build/Shellder.app/Contents/Resources/menubar@2x.png
          file build/Shellder.app/Contents/MacOS/shellder

      - name: Package
        # ditto keeps the bundle's symlinks, permissions and extended attributes.
        run: ditto -c -k --keepParent build/Shellder.app Shellder.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Shellder-${{ matrix.runner }}-${{ github.sha }}
          path: Shellder.zip
          if-no-files-found: error

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Ship the build from the GA runner, not the preview one.
      - uses: actions/download-artifact@v4
        with:
          name: Shellder-macos-26-${{ github.sha }}

      - name: Name the archive after the tag
        run: mv Shellder.zip "Shellder-${GITHUB_REF_NAME}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: Shellder-${{ github.ref_name }}.zip
          generate_release_notes: true
