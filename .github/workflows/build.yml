name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    # A run takes a quarter of an hour; a test that waits for something that
    # never comes must not hold the runner for GitHub's six.
    timeout-minutes: 40
    continue-on-error: ${{ matrix.preview }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 26, current GA image (Xcode 26), Apple silicon
          - runner: macos-26
            preview: false
            platform: darwin-aarch64
          # macOS 27: GitHub has no "macos-27" label, the Xcode 27 image is
          # the one that runs on macOS 27 (since September 2026). Still a
          # public preview, so it must not block a release.
          - runner: xcode-27
            preview: true
            platform: darwin-aarch64
          # Ubuntu 24.04 builds the release (the older glibc makes the
          # AppImage run on more systems); 26.04 builds and tests as well.
          - runner: ubuntu-24.04
            preview: false
            platform: linux-x86_64
          - runner: ubuntu-26.04
            preview: false
            platform: linux-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # The cache holds ~/.cargo/bin with the Tauri CLI in it, built on
          # the runner that saved it. The default key tells the runners
          # apart by OS only, so both Ubuntu versions shared one, and a CLI
          # built against the newer glibc does not run on the older image.
          key: ${{ matrix.runner }}

      - name: Dependencies
        # The apt packages on Ubuntu and the Tauri CLI, see build.sh.
        run: ./build.sh --deps

      - name: Import signing certificate
        # build.sh refuses to sign ad hoc, so the runner needs the same Apple
        # Development certificate the maintainer builds with: the .p12 export
        # (certificate and private key) base64-encoded in SHELLDER_SIGN_P12,
        # its export password in SHELLDER_SIGN_P12_PASSWORD. It goes into a
        # throwaway keychain that the last step deletes. Secrets are not
        # available to pull requests from forks; those builds fail here.
        if: runner.os == 'macOS'
        env:
          P12_BASE64: ${{ secrets.SHELLDER_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.SHELLDER_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::error::secret SHELLDER_SIGN_P12 is not set; build.sh does not sign ad hoc"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          P12="$RUNNER_TEMP/signing.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Icons
        # src-tauri/icons/ is generated from scripts/icon-source.png and not
        # checked in (only the tray pictures are); build.sh makes it, but the
        # tests compile tauri::generate_context!(), which reads the icons
        # too, so they have to exist before the tests run. Same command as
        # build.sh, which then sees them up to date and skips the step.
        run: cargo tauri icon scripts/icon-source.png -o src-tauri/icons >/dev/null

      - name: Unit tests
        # Only ordinary commits run the tests. A release build (a v* tag, or
        # the "[release] x.y.z" commit the tag points at) is the code that the
        # commits before it already tested; skipping them there keeps the
        # release runs short.
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && !startsWith(github.event.head_commit.message, '[release]') }}
        run: cd src-tauri && cargo test --lib --test pty_prompt

      - name: Build
        # The updater artifacts (the .tar.gz / .AppImage and their .sig) are
        # signed with the maintainer's minisign key from the secrets; without
        # them build.sh skips the updater artifacts and the release has none.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./build.sh

      - name: Verify bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --verify --strict --verbose=2 build/Shellder.app
          # Apple-signed, not ad hoc: a Team ID is present.
          codesign -dv --verbose=2 build/Shellder.app 2>&1 | grep -E '^TeamIdentifier=[A-Z0-9]{10}$'
          plutil -lint build/Shellder.app/Contents/Info.plist
          test -f build/Shellder.app/Contents/Resources/icon.icns
          file build/Shellder.app/Contents/MacOS/shellder
          build/Shellder.app/Contents/MacOS/shellder help

      - name: Verify bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          ls -la build
          test -n "$(ls build/*.deb)"
          test -n "$(ls build/*.AppImage)"
          dpkg-deb --info build/*.deb | grep -E 'Package|Version|Depends'

      - name: Package
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = macOS ]; then
            # ditto keeps the bundle's symlinks, permissions and extended attributes.
            ditto -c -k --keepParent build/Shellder.app dist/Shellder-${{ matrix.platform }}.zip
            # The updater artifact, when the signing key was there.
            if [ -f src-tauri/target/release/bundle/macos/Shellder.app.tar.gz.sig ]; then
              cp src-tauri/target/release/bundle/macos/Shellder.app.tar.gz dist/Shellder-${{ matrix.platform }}.app.tar.gz
              cp src-tauri/target/release/bundle/macos/Shellder.app.tar.gz.sig dist/Shellder-${{ matrix.platform }}.app.tar.gz.sig
            fi
          else
            cp build/*.deb dist/
            cp build/*.AppImage dist/Shellder-${{ matrix.platform }}.AppImage
            if ls src-tauri/target/release/bundle/appimage/*.AppImage.sig >/dev/null 2>&1; then
              cp src-tauri/target/release/bundle/appimage/*.AppImage.sig dist/Shellder-${{ matrix.platform }}.AppImage.sig
            fi
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Shellder-${{ matrix.runner }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

      - name: Remove signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      # Ship the builds from the GA runners, not the preview one.
      - uses: actions/download-artifact@v4
        with:
          name: Shellder-macos-26-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: Shellder-ubuntu-24.04-${{ github.sha }}
          path: dist

      - name: Name the archives after the tag and write latest.json
        # latest.json is what the app's updater reads (see Updater in the
        # manual): one entry per platform whose signed artifact is there.
        run: |
          cd dist
          for f in Shellder-*; do mv "$f" "${f/Shellder-/Shellder-${GITHUB_REF_NAME}-}"; done
          VERSION=${GITHUB_REF_NAME#v}
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          ARTS=""
          for p in darwin-aarch64 linux-x86_64; do
            for f in Shellder-${GITHUB_REF_NAME}-$p.app.tar.gz Shellder-${GITHUB_REF_NAME}-$p.AppImage; do
              [ -f "$f.sig" ] && ARTS="$ARTS $p=$f"
            done
          done
          printf 'Release %s' "$GITHUB_REF_NAME" > notes.txt
          if [ -n "$ARTS" ]; then
            ../scripts/latest-json.sh "$VERSION" notes.txt "$BASE" latest.json $ARTS
            cat latest.json
          else
            echo "::warning::no signed updater artifacts; latest.json not written (set TAURI_SIGNING_PRIVATE_KEY)"
          fi
          rm notes.txt
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
