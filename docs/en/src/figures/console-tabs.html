<ol class="shot-legend">
<li data-n="1"><b>group</b>: A set of tabs with its own tab bar, showing one of them.</li>
<li data-n="2"><b>tab bar</b>: The row of a group's tabs with the group buttons at its right.</li>
<li data-n="3"><b>tab</b>: One thing open in a group: a terminal or a preview.</li>
<li data-n="4"><b>tab mark</b>: The dot on a tab that is not shown: new output, the terminal bell or ready bell (orange), a command done (green) or failed (red).</li>
<li data-n="5"><b>kept tab</b>: A tab that stays: opened by a double click, or a temporary tab double-clicked. To *keep* a tab is 固定.</li>
<li data-n="6"><b>temporary tab</b>: A tab opened by a single click, its name in italics: the next single click takes it over.</li>
<li data-n="7"><b>new-tab button</b>: The + after the last tab: a new shell on the host.</li>
<li data-n="8"><b>group buttons</b>: The buttons at a tab bar's right: the group's ready bell, the background button and the split button.</li>
<li data-n="9"><b>background button</b>: Gives the group's terminals, or its previews, a dark or a light background.</li>
<li data-n="10"><b>split</b>: A second group beside or under one, and the act of making it; the *split button* (分栏按钮) offers both ways.</li>
<li data-n="11"><b>ready bell</b>: The bell button in a terminal's top right corner: switched on, it tells every time the terminal is ready for input again. A group's ready bell switches it for every tab of the group.</li>
<li data-n="12"><b>divider</b>: The line between two groups, which drags.</li>
</ol>
