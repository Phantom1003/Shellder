<ol class="shot-legend">
<li data-n="1"><b>top bar</b>: The bar across the top of the window; its blank drags the window.</li>
<li data-n="2"><b>host menu</b>: The host's name in the top bar: a menu that switches the window to another host or to this machine.</li>
<li data-n="3"><b>settings button</b>: The gear at the top bar's right, which opens the Console settings window.</li>
<li data-n="4"><b>panel switcher</b>: The strip of icons down the window's left edge.</li>
<li data-n="5"><b>panel button</b>: An icon of the panel switcher: it shows its panel, and the shown panel's button folds the side bar.</li>
<li data-n="6"><b>side bar</b>: The left region, which shows one panel and can be folded away.</li>
<li data-n="7"><b>Status panel</b>: The host's readings, in cards.</li>
<li data-n="8"><b>card</b>: A rounded box with a title that groups rows about one thing.</li>
<li data-n="9"><b>tab area</b>: The right region of the Console: one group, or several split apart.</li>
<li data-n="10"><b>group</b>: A set of tabs with its own tab bar, showing one of them.</li>
<li data-n="11"><b>tab bar</b>: The row of a group's tabs with the group buttons at its right.</li>
<li data-n="12"><b>tab</b>: One thing open in a group: a terminal or a preview.</li>
<li data-n="13"><b>divider</b>: The line between two groups, which drags.</li>
</ol>
