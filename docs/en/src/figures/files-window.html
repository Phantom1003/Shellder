<ol class="shot-legend">
<li data-n="1"><b>pane</b>: One half of the Files window, showing one host's file tree.</li>
<li data-n="2"><b>host picker</b>: The button at a pane's top left that chooses which host, or this machine, the pane shows.</li>
<li data-n="3"><b>file toolbar</b>: The buttons above a file tree: go to a folder, new folder, new file, delete, hidden files, back, up, refresh.</li>
<li data-n="4"><b>column headings</b>: Name, Date Modified and Size above the file tree; a click sorts by one, the *sort arrow* (排序箭头) says which way.</li>
<li data-n="5"><b>file tree</b>: The list of a folder's entries, in which a folder opens in place.</li>
<li data-n="6"><b>file row</b>: An entry of the file tree.</li>
<li data-n="7"><b>path bar</b>: The folder's path along the foot of a file tree, each part a button.</li>
<li data-n="8"><b>copies strip</b>: The one line under the file tree: the copy under way with its progress, how many wait, *Clear*.</li>
<li data-n="9"><b>copies list</b>: Every copy of this host, opened from the copies strip.</li>
</ol>
