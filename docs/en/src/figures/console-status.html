<ol class="shot-legend">
<li data-n="1"><b>summary card</b>: The first card: the host's name, system, uptime, load, CPUs and logins.</li>
<li data-n="2"><b>Usage card</b>: CPU, memory and swap, each a gauge.</li>
<li data-n="3"><b>interval picker</b>: How often the readings are taken.</li>
<li data-n="4"><b>card picker</b>: The eye on the Usage card: which cards are shown, and read.</li>
<li data-n="5"><b>gauge</b>: A label, a value and a bar that fills with it.</li>
<li data-n="6"><b>GPUs card</b>: Each GPU's load and memory.</li>
<li data-n="7"><b>Disks card</b>: The file systems, and a removable drive's mount, unmount and eject buttons.</li>
<li data-n="8"><b>Network card</b>: The interfaces with their addresses and traffic.</li>
<li data-n="9"><b>Processes card</b>: The busiest table, or the process tree.</li>
<li data-n="10"><b>busiest table</b>: The Processes card as a table of the busiest processes.</li>
<li data-n="11"><b>Logged in card</b>: Who is logged in, and from where.</li>
