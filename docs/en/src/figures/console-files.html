<ol class="shot-legend">
<li data-n="1"><b>Files panel</b>: The host's file tree, with its copies strip.</li>
<li data-n="2"><b>file toolbar</b>: The buttons above a file tree: go to a folder, new folder, new file, delete, hidden files, back, up, refresh.</li>
<li data-n="3"><b>column headings</b>: Name, Date Modified and Size above the file tree; a click sorts by one, the *sort arrow* (排序箭头) says which way.</li>
<li data-n="4"><b>file row</b>: An entry of the file tree.</li>
<li data-n="5"><b>disclosure arrow</b>: The arrow at a folder's left that opens and closes it in the tree.</li>
<li data-n="6"><b>path bar</b>: The folder's path along the foot of a file tree, each part a button.</li>
<li data-n="7"><b>copies strip</b>: The one line under the file tree: the copy under way with its progress, how many wait, *Clear*.</li>
<li data-n="8"><b>copies list</b>: Every copy of this host, opened from the copies strip.</li>
<li data-n="9"><b>preview tab</b>: A tab that shows a file of the Files panel.</li>
<li data-n="10"><b>temporary tab</b>: A tab opened by a single click, its name in italics: the next single click takes it over.</li>
<li data-n="11"><b>preview header</b>: The line at a preview's top: the file's path, its size or page, and the preview's buttons.</li>
</ol>
