<ol class="shot-legend">
<li data-n="1"><b>host list</b>: The left column: every host of the ssh config, one row each.</li>
<li data-n="2"><b>host row</b>: A host in the host list: its status dot, its name, its Connect switch, and the Console button while the pointer is on it.</li>
<li data-n="3"><b>status dot</b>: The coloured dot that says how the host's connection is: grey off, yellow trying, green up, blue up and locked, cyan a master that is not Shellder's, red failed.</li>
<li data-n="4"><b>Connect switch</b>: A host's switch: on is one attempt to connect, off closes the master.</li>
<li data-n="5"><b>list toolbar</b>: The buttons under the host list: reload and edit the ssh config, Settings, the update, the log panel.</li>
<li data-n="6"><b>host page</b>: The right side of the main window: everything about the selected host, in cards.</li>
<li data-n="7"><b>connection card</b>: The host page's first card: the host's name, its status line, the connection buttons, the keep-alive mode and the reconnect rule.</li>
<li data-n="8"><b>status line</b>: The line under the host's name that spells the state out (*Connected*, *Dropped — retrying in 5s*).</li>
<li data-n="9"><b>connection buttons</b>: Lock, Connect, Disconnect, Reconnect, Retry now, Take over, Close socket, whichever apply.</li>
<li data-n="10"><b>Tools card</b>: The Console and Files buttons, and under them the host's forwards and direct connections.</li>
<li data-n="11"><b>Credentials card</b>: The credentials stored for the host, a *credential row* each.</li>
<li data-n="12"><b>Configuration card</b>: What `ssh -G` says the host's configuration comes to.</li>
<li data-n="13"><b>log panel</b>: The log under the main window's two columns, opened and closed with ⌘L.</li>
</ol>
