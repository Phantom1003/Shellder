<ol class="shot-legend">
<li data-n="1"><b>主机列表</b>：左边一列：ssh 配置里的每台主机各占一行。</li>
<li data-n="2"><b>主机行</b>：主机列表里的一台主机：状态点、名字、连接开关，指针移上去时还有控制台按钮。</li>
<li data-n="3"><b>状态点</b>：表示连接状态的彩色圆点：灰色关闭、黄色连接中、绿色已连接、蓝色已连接并锁定、青色是别人的主连接、红色失败。</li>
<li data-n="4"><b>连接开关</b>：主机的开关：打开是尝试连接一次，关闭则关掉主连接。</li>
<li data-n="5"><b>列表工具栏</b>：主机列表下方的一排按钮：重新加载和编辑 ssh 配置、设置、更新、日志面板。</li>
<li data-n="6"><b>主机页</b>：主窗口右侧：所选主机的全部信息，分成几张卡片。</li>
<li data-n="7"><b>连接卡片</b>：主机页的第一张卡片：主机名、状态行、连接按钮、保活方式和重连规则。</li>
<li data-n="8"><b>状态行</b>：主机名下面用文字写出状态的那一行（“已连接”“已断开，5 秒后重试”）。</li>
<li data-n="9"><b>连接按钮</b>：锁定、连接、断开、重新连接、立即重试、接管、关闭套接字，按当前状态显示其中几个。</li>
<li data-n="10"><b>工具卡片</b>：控制台和文件两个按钮，下面是这台主机的端口转发和直连。</li>
<li data-n="11"><b>凭据卡片</b>：为这台主机保存的凭据，每项一行。</li>
<li data-n="12"><b>配置卡片</b>：`ssh -G` 给出的这台主机的最终配置。</li>
<li data-n="13"><b>日志面板</b>：主窗口两栏下方的日志，用 ⌘L 打开和收起。</li>
</ol>
