<ol class="shot-legend">
<li data-n="1"><b>分组</b>：一组标签页，有自己的标签栏，显示其中一个。</li>
<li data-n="2"><b>标签栏</b>：分组顶部那一行：各个标签页，右端是分组按钮。</li>
<li data-n="3"><b>标签页</b>：分组里打开的一项：终端或预览。</li>
<li data-n="4"><b>标签标记</b>：未显示的标签页上的圆点：有新输出、响过铃或就绪提醒（橙色）、命令完成（绿色）或失败（红色）。</li>
<li data-n="5"><b>固定标签页</b>：留下来的标签页：双击打开，或双击临时标签页。</li>
<li data-n="6"><b>临时标签页</b>：单击打开的标签页，名字是斜体：下一次单击会顶替它。</li>
<li data-n="7"><b>新建按钮</b>：最后一个标签页后面的 +：在主机上新开一个 shell。</li>
<li data-n="8"><b>分组按钮</b>：标签栏右端的按钮：分组的就绪提醒、背景按钮和分栏按钮。</li>
<li data-n="9"><b>背景按钮</b>：让分组的终端（或预览）用深色或浅色背景。</li>
<li data-n="10"><b>分栏</b>：在一个分组旁边或下面再开一个分组，以及这个动作；“分栏按钮”提供两个方向。</li>
<li data-n="11"><b>就绪提醒</b>：终端右上角的铃铛按钮：打开后，每当终端再次可以输入时提醒你。分组的就绪提醒对该分组的所有标签页一起开关。</li>
<li data-n="12"><b>分隔线</b>：两个分组之间可以拖动的线。</li>
</ol>
