<ol class="shot-legend">
<li data-n="1"><b>文件面板</b>：主机的文件树，带复制状态条。</li>
<li data-n="2"><b>文件工具栏</b>：文件树上方的按钮：前往文件夹、新建文件夹、新建文件、删除、隐藏文件、返回、上一级、刷新。</li>
<li data-n="3"><b>列标题</b>：文件树上方的“名称”“修改日期”“大小”；点击按该列排序，“排序箭头”表示方向。</li>
<li data-n="4"><b>文件行</b>：文件树里的一项。</li>
<li data-n="5"><b>展开箭头</b>：文件夹左边的箭头，在树里展开或收起它。</li>
<li data-n="6"><b>路径栏</b>：文件树底部的当前路径，每一段都是按钮。</li>
<li data-n="7"><b>复制状态条</b>：文件树下方的一行：正在进行的复制及其进度、等待的个数、“清空”。</li>
<li data-n="8"><b>复制列表</b>：这台主机的所有复制，从复制状态条展开。</li>
<li data-n="9"><b>预览标签页</b>：显示文件面板里某个文件的标签页。</li>
<li data-n="10"><b>临时标签页</b>：单击打开的标签页，名字是斜体：下一次单击会顶替它。</li>
<li data-n="11"><b>预览标题栏</b>：预览顶部的一行：文件路径、大小或页码，以及预览的按钮。</li>
