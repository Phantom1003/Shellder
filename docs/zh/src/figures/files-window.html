<ol class="shot-legend">
<li data-n="1"><b>窗格</b>：文件窗口的一半，显示一台主机的文件树。</li>
<li data-n="2"><b>主机选择器</b>：窗格左上角的按钮，选择这个窗格显示哪台主机或本机。</li>
<li data-n="3"><b>文件工具栏</b>：文件树上方的按钮：前往文件夹、新建文件夹、新建文件、删除、隐藏文件、返回、上一级、刷新。</li>
<li data-n="4"><b>列标题</b>：文件树上方的“名称”“修改日期”“大小”；点击按该列排序，“排序箭头”表示方向。</li>
<li data-n="5"><b>文件树</b>：一个文件夹里各项的列表，文件夹可以就地展开。</li>
<li data-n="6"><b>文件行</b>：文件树里的一项。</li>
<li data-n="7"><b>路径栏</b>：文件树底部的当前路径，每一段都是按钮。</li>
<li data-n="8"><b>复制状态条</b>：文件树下方的一行：正在进行的复制及其进度、等待的个数、“清空”。</li>
<li data-n="9"><b>复制列表</b>：这台主机的所有复制，从复制状态条展开。</li>
