<ol class="shot-legend">
<li data-n="1"><b>顶栏</b>：窗口顶部的横条；空白处可以拖动窗口。</li>
<li data-n="2"><b>主机菜单</b>：顶栏里的主机名：一个菜单，把窗口切换到另一台主机或本机。</li>
<li data-n="3"><b>设置按钮</b>：顶栏右端的齿轮，打开控制台设置窗口。</li>
<li data-n="4"><b>面板切换条</b>：窗口左边缘的一竖条图标。</li>
<li data-n="5"><b>面板按钮</b>：面板切换条上的一个图标：显示对应的面板；再点当前面板的按钮则折叠侧栏。</li>
<li data-n="6"><b>侧栏</b>：左侧区域，显示一个面板，可以折叠。</li>
<li data-n="7"><b>状态面板</b>：主机的各项读数，分成卡片。</li>
<li data-n="8"><b>卡片</b>：带标题的圆角框，放关于同一件事的几行内容。</li>
<li data-n="9"><b>标签区</b>：控制台右侧区域：一个分组，或分栏出来的几个。</li>
<li data-n="10"><b>分组</b>：一组标签页，有自己的标签栏，显示其中一个。</li>
<li data-n="11"><b>标签栏</b>：分组顶部那一行：各个标签页，右端是分组按钮。</li>
<li data-n="12"><b>标签页</b>：分组里打开的一项：终端或预览。</li>
<li data-n="13"><b>分隔线</b>：两个分组之间可以拖动的线。</li>
</ol>
